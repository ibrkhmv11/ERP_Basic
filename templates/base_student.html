<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Najot ERP — Talaba Paneli{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ════════════════════════════════════════════════════
           DESIGN TOKENS (Student — Purple/Indigo theme)
        ════════════════════════════════════════════════════ */
        :root {
            --sidebar-width:     260px;
            --sidebar-collapsed: 72px;
            --primary:           #6366f1;   /* indigo-500 */
            --primary-dark:      #4f46e5;   /* indigo-600 */
            --primary-light:     #e0e7ff;   /* indigo-100 */
            --accent:            #8b5cf6;   /* violet-500 */
            --success:           #10b981;
            --danger:            #ef4444;
            --info:              #3b82f6;
            --sidebar-bg:        #0f172a;   /* slate-900 */
            --sidebar-text:      #94a3b8;
            --navbar-bg:         #ffffff;
            --body-bg:           #f8fafc;   /* slate-50 */
            --card-radius:       16px;
            --transition:        all .3s cubic-bezier(.4,0,.2,1);
            --font-family:       'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background: var(--body-bg);
            color: #1e293b;
            min-height: 100vh;
        }

        /* ─── SIDEBAR ──────────────────────────────────────── */
        #sidebar {
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 1040;
            overflow: hidden;
            box-shadow: 4px 0 24px rgba(0,0,0,0.05);
        }
        #sidebar.collapsed { width: var(--sidebar-collapsed); }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,.05);
            min-height: 80px;
            text-decoration: none;
        }
        .sidebar-brand .brand-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }
        .sidebar-brand .brand-text {
            color: #f8fafc;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -.5px;
            white-space: nowrap;
            transition: var(--transition);
        }
        #sidebar.collapsed .brand-text { opacity: 0; width: 0; }

        .student-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 16px 16px;
            padding: 10px 14px;
            background: linear-gradient(135deg, rgba(99,102,241,.15), rgba(139,92,246,.15));
            border: 1px solid rgba(99,102,241,.3);
            border-radius: 12px;
        }
        .student-chip .chip-icon {
            color: #a5b4fc;
            font-size: 1rem;
        }
        .student-chip .chip-text {
            font-size: .8rem;
            font-weight: 700;
            color: #c7d2fe;
            white-space: nowrap;
        }
        #sidebar.collapsed .student-chip { justify-content: center; padding: 10px; margin: 20px 10px 16px;}
        #sidebar.collapsed .student-chip .chip-text { display: none; }

        .sidebar-nav { flex: 1; padding: 10px 16px; overflow-y: auto; }
        .sidebar-nav::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            color: var(--sidebar-text);
            text-decoration: none;
            font-size: .95rem;
            font-weight: 500;
            margin-bottom: 6px;
            white-space: nowrap;
            transition: var(--transition);
        }
        .sidebar-item i {
            font-size: 1.25rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
            transition: var(--transition);
        }
        .sidebar-item .item-label { transition: var(--transition); }
        #sidebar.collapsed .item-label { opacity: 0; width: 0; overflow: hidden; }

        .sidebar-item:hover {
            background: rgba(255,255,255,.05);
            color: #f8fafc;
        }
        .sidebar-item:hover i { color: #a5b4fc; transform: scale(1.1); }
        .sidebar-item.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            box-shadow: 0 4px 12px rgba(99,102,241,0.25);
        }
        .sidebar-item.active i { color: #fff; }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,.05);
        }
        .sidebar-footer .sidebar-item { color: #f43f5e; }
        .sidebar-footer .sidebar-item:hover { background: rgba(244,63,94,.1); color: #f43f5e; }

        /* ─── TOPBAR ────────────────────────────────────────── */
        #topbar {
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            height: 80px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid #f1f5f9;
            z-index: 1030;
            transition: var(--transition);
        }
        #topbar.expanded { left: var(--sidebar-collapsed); }

        .topbar-left { display: flex; align-items: center; gap: 16px; }
        #sidebarToggle {
            background: #f8fafc; border: 1px solid #e2e8f0;
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            font-size: 1.2rem;
            color: #475569;
            cursor: pointer;
            transition: var(--transition);
        }
        #sidebarToggle:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary-light); }

        .topbar-right { display: flex; align-items: center; gap: 16px; }

        .topbar-badge {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border: 1px solid #e2e8f0;
            color: #1e293b;
            border-radius: 100px;
            padding: 8px 16px;
            font-size: .85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .topbar-avatar {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 800; font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99,102,241,0.25);
            text-decoration: none;
            transition: var(--transition);
        }
        .topbar-avatar:hover { transform: scale(1.05); }

        /* ─── MAIN CONTENT ──────────────────────────────────── */
        #main-content {
            margin-left: var(--sidebar-width);
            padding-top: 80px;
            min-height: 100vh;
            transition: var(--transition);
        }
        #main-content.expanded { margin-left: var(--sidebar-collapsed); }

        .content-wrapper { padding: 32px; max-width: 1400px; margin: 0 auto; }

        /* ─── CARD ──────────────────────────────────────────── */
        .card {
            border: none;
            border-radius: var(--card-radius);
            box-shadow: 0 4px 20px rgba(0,0,0,.03);
            transition: var(--transition);
            background: #fff;
        }
        .card:hover { box-shadow: 0 8px 30px rgba(0,0,0,.06); }

        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .page-header h1 { font-size: 1.8rem; font-weight: 800; color: #0f172a; letter-spacing: -.5px; margin: 0; }
        .page-header .page-subtitle { font-size: .95rem; color: #64748b; margin-top: 4px; font-weight: 500; }

        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); }
            #sidebar.mobile-open { transform: translateX(0); width: var(--sidebar-width); }
            #topbar { left: 0 !important; padding: 0 16px; }
            #main-content { margin-left: 0 !important; }
            .content-wrapper { padding: 24px 16px; }
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
    <a href="{% url 'dashboard' %}" class="sidebar-brand">
        <div class="brand-icon"><i class="bi bi-rocket-takeoff-fill"></i></div>
        <span class="brand-text">Najot ERP</span>
    </a>

    <div class="student-chip">
        <i class="bi bi-mortarboard-fill chip-icon"></i>
        <span class="chip-text">Talaba Paneli</span>
    </div>

    <div class="sidebar-nav">
        <a href="{% url 'dashboard' %}" class="sidebar-item active">
            <i class="bi bi-grid-fill"></i>
            <span class="item-label">Bosh sahifa</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <a href="{% url 'profile' %}" class="sidebar-item" style="color:#94a3b8; margin-bottom:8px;">
            <i class="bi bi-person-circle"></i>
            <span class="item-label">Mening Profilim</span>
        </a>
        <a href="{% url 'logout' %}" class="sidebar-item">
            <i class="bi bi-box-arrow-right"></i>
            <span class="item-label">Tizimdan chiqish</span>
        </a>
    </div>
</nav>

<!-- TOPBAR -->
<header id="topbar">
    <div class="topbar-left">
        <button id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <h4 class="mb-0 fw-bold d-none d-sm-block text-slate-800" style="color: #1e293b; font-size: 1.1rem;">Dashboard</h4>
    </div>

    <div class="topbar-right">
        <div class="topbar-badge">
            <i class="bi bi-person-fill" style="color: var(--primary);"></i>
            <span>{{ user.get_full_name|default:user.username }}</span>
        </div>
        <a href="{% url 'profile' %}" class="topbar-avatar">
            {{ user.username|slice:":1"|upper }}
        </a>
    </div>
</header>

<!-- MAIN CONTENT -->
<main id="main-content">
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebar     = document.getElementById('sidebar');
    const topbar      = document.getElementById('topbar');
    const mainContent = document.getElementById('main-content');
    const toggleBtn   = document.getElementById('sidebarToggle');
    const KEY         = 'studentSidebarCollapsed';

    function applyState(collapsed) {
        sidebar.classList.toggle('collapsed', collapsed);
        topbar.classList.toggle('expanded', collapsed);
        mainContent.classList.toggle('expanded', collapsed);
    }
    applyState(localStorage.getItem(KEY) === 'true');

    toggleBtn.addEventListener('click', () => {
        const next = !sidebar.classList.contains('collapsed');
        applyState(next);
        localStorage.setItem(KEY, String(next));
    });
</script>

</body>
</html>
